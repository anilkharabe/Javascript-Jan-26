<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model</title>
    <style>
        span{
            background-color: rgb(0, 0, 0);
        }

        .first_span{
            color: rgb(229, 228, 233);
            border: 1px solid rgb(226, 119, 119);
            display: block;
            margin: 50px 40px 30px 20px;
            color: blueviolet;
            height: 100px;
            width: 50%;
        }
        .second_span{
            color: rgb(229, 228, 233);
            border: 1px solid rgb(226, 119, 119);
            display: block;
            margin: 60px 50px;
            padding: 50px 10px;
        }
    </style>
</head>
<body>
    <span class="first_span">this is span</span> 
    <span class="second_span">this is second span</span> 

</body>
</html>
